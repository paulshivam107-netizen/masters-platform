<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#f4f6f3" />
    <meta name="robots" content="noindex, follow" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.svg" type="image/svg+xml" />
    <meta
      name="description"
      content="Practise MBA, EMBA and MiM interviews with questions from your résumé, follow-ups on your answers and a debrief. Free to use right now."
    />
    <script>
      try {
        var savedTheme = localStorage.getItem("ui_theme");
        var darkTheme =
          savedTheme === "dark" ||
          ((!savedTheme || savedTheme === "system") &&
            window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.theme = darkTheme ? "dark" : "light";
        document.documentElement.dataset.reducedMotion =
          localStorage.getItem("ui_reduced_motion") === "true"
            ? "true"
            : "false";
        document.documentElement.style.colorScheme = darkTheme
          ? "dark"
          : "light";
      } catch (error) {
        /* Use the default theme when storage is unavailable. */
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;450;500;550;600;650;700&family=Manrope:wght@400;500;600;650;700;750;800&display=swap" />
    <title>MockMBA · Mock interviews for MBA, EMBA and MiM</title>
  </head>
  <body>
    <noscript
      >Public guides are readable without JavaScript. Enable JavaScript to use
      your application workspace.</noscript
    >
    <div id="root"></div>
  </body>
</html>
