<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#f4f6f3" />
    <meta name="robots" content="noindex, follow" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.svg" type="image/svg+xml" />
    <meta
      name="description"
      content="Masters — a thoughtful space for your applications, essays and interview preparation."
    />
    <script>
      try {
        var savedTheme = localStorage.getItem("ui_theme");
        var darkTheme =
          savedTheme === "dark" ||
          ((!savedTheme || savedTheme === "system") &&
            window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.theme = darkTheme ? "dark" : "light";
        document.documentElement.dataset.reducedMotion =
          localStorage.getItem("ui_reduced_motion") === "true"
            ? "true"
            : "false";
        document.documentElement.style.colorScheme = darkTheme
          ? "dark"
          : "light";
      } catch (error) {
        /* Use the default theme when storage is unavailable. */
      }
    </script>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <title>Masters · Your next chapter</title>
  </head>
  <body>
    <noscript
      >Public guides are readable without JavaScript. Enable JavaScript to use
      your application workspace.</noscript
    >
    <div id="root"></div>
  </body>
</html>
